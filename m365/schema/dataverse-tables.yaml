# Dataverse schema — Chief of Staff agent
#
# Source of truth for table definitions. Create these in the agent's
# Power Platform environment (solution: "ChiefOfStaff", publisher prefix: cos).
# Fallback (ADR-002): same columns as SharePoint Lists; lookups become
# number columns holding the target item ID.
#
# Column types: text, multiline, choice, lookup, int, decimal, date, datetime, bool, json (multiline holding JSON)

version: 0.1.0
prefix: cos

tables:
  cos_goal:
    description: Active objectives, mirrored from goals.yaml. Drives goal_fit scoring.
    columns:
      name:          {type: text, required: true}
      priority:      {type: int, required: true, note: "1 = highest"}
      target:        {type: multiline}
      key_results:   {type: multiline}
      progress:      {type: decimal, min: 0, max: 1}
      status:        {type: choice, values: [on_track, at_risk, behind, complete]}
      quarter:       {type: text}
      last_progress_update: {type: date}

  cos_item:
    description: Anything on the list — task, follow-up, decision, research, prep.
    columns:
      title:          {type: text, required: true}
      description:    {type: multiline}
      item_type:      {type: choice, values: [task, follow_up, decision, research, meeting_prep, review, errand]}
      source:         {type: choice, values: [chat, email, teams, meeting, planner, todo, agent_detected, schedule]}
      status:         {type: choice, values: [inbox, triaged, scheduled, in_progress, waiting, blocked, done, dropped], default: inbox}
      priority_score: {type: int, min: 0, max: 100}
      priority_tier:  {type: choice, values: [P1, P2, P3, P4]}
      score_breakdown: {type: json, note: "output of prioritize skill: factor -> points"}
      rationale:      {type: multiline, note: "one or two sentences: why this rank"}
      next_action:    {type: text, note: "verb-first, concrete"}
      goal:           {type: lookup, target: cos_goal}
      due_date:       {type: date, note: "hard deadline (external)"}
      do_date:        {type: date, note: "planned work date (internal)"}
      effort_minutes: {type: int}
      energy:         {type: choice, values: [deep, shallow]}
      owner:          {type: choice, values: [me, delegated]}
      delegated_to:   {type: text}
      waiting_on:     {type: text}
      research_notes: {type: multiline, note: "intake investigation summary"}
      confidential:   {type: bool, default: false, note: "set when CLAUDE.md §1.5 keywords hit"}
      signature:      {type: text, note: "verb|object|counterpart, set at reconcile; mining key"}
      playbook:       {type: lookup, target: cos_skill, note: "skill/playbook used, if any"}
      completed_on:   {type: datetime}
      planner_task_id: {type: text, note: "optional mirror (ADR-002)"}

  cos_link:
    description: Links an item to its context — the "linked activities".
    columns:
      item:        {type: lookup, target: cos_item, required: true}
      link_type:   {type: choice, values: [email, teams_message, meeting, file, loop, person, url, planner_task, item]}
      relation:    {type: choice, values: [source, context, evidence, output, blocks, blocked_by, related]}
      title:       {type: text}
      web_url:     {type: text, note: "deep link the user can click"}
      graph_id:    {type: text, note: "Graph id / iCalUId / driveItem id for re-fetch"}
      person_email: {type: text, note: "for link_type=person"}
      added_by:    {type: choice, values: [user, agent, flow]}

  cos_activity:
    description: Append-only event log per item. Feeds time tracking and mining.
    columns:
      item:        {type: lookup, target: cos_item}
      at:          {type: datetime, required: true}
      actor:       {type: choice, values: [user, agent, flow]}
      action:      {type: choice, values: [created, investigated, prioritized, scheduled, started, worked, drafted, completed, reconciled, deferred, dropped, reopened, completion_asked]}
      detail:      {type: multiline}
      tools_used:  {type: text, note: "comma-separated tool names"}
      minutes:     {type: int}

  cos_record:
    description: Durable completion record written by the reconcile skill.
    columns:
      item:          {type: lookup, target: cos_item, required: true}
      outcome:       {type: multiline, required: true, note: "what was achieved, 1-3 sentences"}
      decisions:     {type: multiline}
      people:        {type: text, note: "emails of people involved"}
      artifacts:     {type: json, note: "[{title, web_url, link_type}] — also written as cos_link relation=output"}
      minutes_spent: {type: int}
      steps:         {type: json, note: "ordered [{step, tool, minutes}] — mining input"}
      signature:     {type: text, required: true}
      what_worked:   {type: multiline}
      follow_ups:    {type: text, note: "ids of cos_item created as follow-ups"}
      goal_delta:    {type: decimal, note: "progress added to linked goal"}

  cos_brief:
    description: One row per daily brief.
    columns:
      brief_date:   {type: date, required: true}
      content:      {type: multiline, note: "markdown as delivered"}
      top3:         {type: json, note: "[item ids]"}
      plan:         {type: json, note: "[{start, end, item_id}]"}
      dropped:      {type: json, note: "[item ids recommended to drop/delegate]"}
      status:       {type: choice, values: [delivered, accepted, edited, rejected]}
      edit_count:   {type: int, default: 0}
      channel:      {type: choice, values: [teams_card, copilot_chat, email]}

  cos_feedback:
    description: Every accept/edit/reject/correction. Drives behavior changes.
    columns:
      at:           {type: datetime, required: true}
      target_type:  {type: choice, values: [brief, item, draft, skill_run, playbook, instruction, prioritization]}
      target_ref:   {type: text, note: "row id of the target"}
      signal:       {type: choice, values: [accept, edit, reject, correction, praise]}
      detail:       {type: multiline, note: "verbatim user words for corrections"}
      theme:        {type: text, note: "normalized tag, e.g. 'tone:too-formal', 'rank:meetings-overweighted'"}
      applied:      {type: bool, default: false}
      resulting_change: {type: text, note: "skill/instruction version that addressed it"}

  cos_skill:
    description: Skill registry — proposals, playbooks (runtime), and native skills.
    columns:
      name:          {type: text, required: true, note: "kebab-case, matches SKILL.md name"}
      version:       {type: text, default: "0.1.0"}
      tier:          {type: choice, values: [playbook, native]}
      status:        {type: choice, values: [proposed, active, rejected, retired]}
      description:   {type: multiline, required: true, note: "routing text: when to use / when not"}
      signatures:    {type: text, note: "comma-separated signatures it handles"}
      body:          {type: multiline, note: "full SKILL.md text"}
      evidence:      {type: json, note: "[cos_record ids]"}
      est_minutes_saved: {type: int}
      runs:          {type: int, default: 0}
      success_rate:  {type: decimal}
      last_used:     {type: datetime}
      approved_on:   {type: datetime}
      repo_path:     {type: text, note: "m365/skills/<name> once native"}

  cos_skill_run:
    description: One row per skill/playbook execution.
    columns:
      skill:        {type: lookup, target: cos_skill, required: true}
      item:         {type: lookup, target: cos_item}
      at:           {type: datetime, required: true}
      outcome:      {type: choice, values: [success, partial, fail]}
      user_edits:   {type: int, default: 0}
      minutes_saved_est: {type: int}
      notes:        {type: multiline}
