# Workbook schema — Chief of Staff agent (v1 store, ADR-006)
#
# Source of truth for ChiefOfStaff.xlsx. Build the file with:
#   python3 m365/scripts/build_workbook.py
# then upload it to OneDrive (suggested path: /Apps/ChiefOfStaff/ChiefOfStaff.xlsx).
#
# Rules imposed by the Excel Online (Business) connector:
#   - Data must be in Excel tables; each table has a text key column for Get/Update a row.
#   - Column names are alphanumeric only (Filter/Order By/Select reject spaces and symbols).
#   - Only ONE filter function per column -> Items has an Open (Yes/No) column so
#     "all open items" is a single filter: Open eq 'Yes'.
#   - No formulas and no hidden columns (recalc timeouts; OData breaks on hidden columns).
#   - Update a row overwrites cells; to append (History), Get a row first.
#   - Dates are stored as ISO text (YYYY-MM-DD / YYYY-MM-DDTHH:MM) so they sort and
#     round-trip through the connector without serial-number conversion.
#   - Multi-value cells use one entry per line. Links: "[type] Title | https://url".

version: 0.3.0
file: ChiefOfStaff.xlsx

tables:
  Items:
    sheet: List
    key: ID
    description: The daily activity list. One row per item, with context and the completion record inline.
    columns:
      # --- Plan ---
      - {name: ID, group: plan, width: 18, note: "I-YYYYMMDD-HHMMSS (agent-generated, unique)"}
      - {name: Open, group: plan, width: 7, values: ["Yes", "No"], note: "Yes unless Status is done or dropped"}
      - {name: Status, group: plan, width: 12, values: [inbox, triaged, scheduled, in_progress, waiting, blocked, done, dropped]}
      - {name: Tier, group: plan, width: 6, values: [P1, P2, P3, P4]}
      - {name: Score, group: plan, width: 7, type: int, note: "0-100, prioritize rubric"}
      - {name: Title, group: plan, width: 40, note: "verb-first, <=80 chars"}
      - {name: NextAction, group: plan, width: 36}
      - {name: DueDate, group: plan, width: 12, type: date, note: "hard external deadline"}
      - {name: DoDate, group: plan, width: 12, type: date, note: "planned work date"}
      - {name: PlannedSlot, group: plan, width: 13, note: "HH:MM-HH:MM on DoDate"}
      - {name: EffortMin, group: plan, width: 10, type: int}
      - {name: Energy, group: plan, width: 9, values: [deep, shallow]}
      - {name: Goal, group: plan, width: 12, note: "Goals.ID"}
      - {name: Owner, group: plan, width: 10, values: [me, delegated]}
      - {name: WaitingOn, group: plan, width: 18}
      # --- Why ---
      - {name: Rationale, group: why, width: 40, note: "1-2 sentences: why this rank"}
      - {name: ScoreBreakdown, group: why, width: 30, note: "deadline=25; goal=18; stakeholder=10; unblocks=0; leverage=5; age=0"}
      # --- Context ---
      - {name: Type, group: context, width: 13, values: [task, follow_up, decision, research, meeting_prep, review, errand]}
      - {name: Source, group: context, width: 11, values: [chat, email, teams, meeting, planner, todo, detected, schedule]}
      - {name: SourceLink, group: context, width: 40, note: "single link: [type] Title | url"}
      - {name: ContextLinks, group: context, width: 50, note: "one per line: [email|teams|meeting|file|loop|person|url] Title | url"}
      - {name: People, group: context, width: 30, note: "emails, one per line"}
      - {name: ResearchNotes, group: context, width: 50, note: "2-4 bullets from intake"}
      - {name: Confidential, group: context, width: 12, values: ["Yes", "No"], note: "Yes -> titles and links only"}
      # --- Tracking ---
      - {name: Created, group: tracking, width: 17, type: datetime}
      - {name: Updated, group: tracking, width: 17, type: datetime}
      - {name: History, group: tracking, width: 50, note: "append-only, one line per event: YYYY-MM-DD HH:MM actor action detail"}
      # --- Completion record (written once by reconcile) ---
      - {name: CompletedOn, group: record, width: 17, type: datetime}
      - {name: Outcome, group: record, width: 45, note: "what was achieved, 1-3 sentences"}
      - {name: Decisions, group: record, width: 35}
      - {name: Artifacts, group: record, width: 45, note: "output links, one per line"}
      - {name: MinutesSpent, group: record, width: 13, type: int}
      - {name: Steps, group: record, width: 45, note: "one per line: step | tool | minutes (~ = estimate)"}
      - {name: Signature, group: record, width: 30, note: "verb|object|counterpart — mining key"}
      - {name: SkillUsed, group: record, width: 18, note: "Skills.Name"}
      - {name: FollowUps, group: record, width: 20, note: "Items.ID created as follow-ups"}

  Goals:
    sheet: Goals
    key: ID
    description: Active objectives (from goals.yaml). Drives goal-fit scoring.
    columns:
      - {name: ID, width: 8, note: "G1, G2, ... for work objectives; PG1, PG2, ... for personal goals"}
      - {name: Goal, width: 40}
      - {name: Priority, width: 9, type: int, note: "1 = highest"}
      - {name: Target, width: 40}
      - {name: KeyResults, width: 50, note: "one per line"}
      - {name: Progress, width: 9, type: decimal, note: "0.0-1.0"}
      - {name: Status, width: 11, values: [on_track, at_risk, behind, complete]}
      - {name: Quarter, width: 9}
      - {name: LastUpdate, width: 12, type: date}

  Skills:
    sheet: Skills
    key: Name
    description: Skill registry — proposals, runtime playbooks, and native skills.
    columns:
      - {name: Name, width: 24, note: "kebab-case, matches SKILL.md name"}
      - {name: Version, width: 9}
      - {name: Tier, width: 10, values: [playbook, native]}
      - {name: Status, width: 10, values: [proposed, active, rejected, retired]}
      - {name: Description, width: 50, note: "routing text: when to use / when not"}
      - {name: Signatures, width: 30, note: "one per line"}
      - {name: Body, width: 60, note: "full SKILL.md text (playbooks)"}
      - {name: Evidence, width: 25, note: "Items.ID that justified it, one per line"}
      - {name: EstMinSaved, width: 12, type: int, note: "per run"}
      - {name: Runs, width: 7, type: int}
      - {name: Successes, width: 10, type: int, note: "success rate = Successes / Runs"}
      - {name: LastUsed, width: 17, type: datetime}
      - {name: ApprovedOn, width: 17, type: datetime}
      - {name: RepoPath, width: 25, note: "m365/skills/<name> once native"}

  Feedback:
    sheet: Feedback
    key: ID
    description: Every accept/edit/reject/correction, plus skill-run outcomes.
    columns:
      - {name: ID, width: 18, note: "F-YYYYMMDD-HHMMSS"}
      - {name: Date, width: 17, type: datetime}
      - {name: TargetType, width: 14, values: [brief, item, draft, skill_run, playbook, instruction, prioritization]}
      - {name: TargetRef, width: 20, note: "Items.ID, Skills.Name, or brief date"}
      - {name: Signal, width: 11, values: [accept, edit, reject, correction, praise, success, partial, fail]}
      - {name: Detail, width: 50, note: "verbatim user words for corrections"}
      - {name: Theme, width: 30, note: "e.g. rank:meetings-overweighted, tone:too-formal"}
      - {name: Applied, width: 9, values: ["Yes", "No"]}
      - {name: ResultingChange, width: 30, note: "skill/instruction version that addressed it"}

  People:
    sheet: People
    key: Email
    description: Relationships worth keeping warm. Tier sets the check-in cadence (1 = 14 days, 2 = 30, 3 = 60).
    columns:
      - {name: Email, width: 28, note: "key; lowercase"}
      - {name: Name, width: 22}
      - {name: Tier, width: 6, values: ["1", "2", "3"], note: "1 inner circle · 2 active network · 3 extended"}
      - {name: Role, width: 24, note: "role and company"}
      - {name: CadenceDays, width: 12, type: int, note: "optional override of the tier cadence"}
      - {name: LastContact, width: 12, type: date, note: "latest two-way interaction found"}
      - {name: LastChannel, width: 12, values: [email, teams, meeting, call, in_person]}
      - {name: Notes, width: 50, note: "one per line, dated: 'Training for a marathon (added 2026-10-29)'"}
      - {name: NextTouch, width: 40, note: "suggested reason to reach out, refreshed by relationship-check"}
      - {name: Updated, width: 17, type: datetime}
