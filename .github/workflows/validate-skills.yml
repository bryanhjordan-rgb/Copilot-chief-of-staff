name: Validate skills

on:
  pull_request:
    paths:
      - "m365/**"
  push:
    branches: [main]
    paths:
      - "m365/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 m365/scripts/skills.py validate
