name: Validate skills

on:
  pull_request:
    paths:
      - "m365/**"
  push:
    branches: [main]
    paths:
      - "m365/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml openpyxl
      - run: npm install -g typescript@5.6.3  # Office Script parity test
      - run: python3 m365/scripts/skills.py validate
      - run: python3 m365/scripts/build_workbook.py "$RUNNER_TEMP/ChiefOfStaff.xlsx"
      - run: python3 m365/scripts/lint_workbook.py m365/workbook/ChiefOfStaff.xlsx
      - name: Committed workbook and prebuilt skill zips match the source
        run: |
          python3 m365/scripts/build_workbook.py
          python3 m365/scripts/skills.py prebuild
          git status --porcelain m365/workbook m365/kit
          test -z "$(git status --porcelain m365/workbook m365/kit)" || { echo 'Stale: run build_workbook.py and skills.py prebuild, then commit'; exit 1; }
      - run: python3 -m unittest discover -s m365/tests -v
      - run: python3 m365/scripts/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChiefOfStaff-kit
          path: dist/kit/
